name = "intra-api"
account_id = "eed296214f8b8aa38533e38843f88aff"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Cron 1: atualiza notícias às 6h30 BRT (09h30 UTC) de seg a sex
# Cron 2: snapshot de receita por equipe às 18h BRT (21h UTC) de seg a sex
[triggers]
crons = ["30 9 * * 1-5", "0 21 * * 1-5"]

[[d1_databases]]
binding = "DB"
database_name = "intra-db"
database_id = "2a2d6afb-195a-4aa9-8f35-71748dd75dfc"
preview_database_id = "2a2d6afb-195a-4aa9-8f35-71748dd75dfc"

[[d1_databases]]
binding = "PERF_DB"
database_name = "nobel-performance-db"
database_id = "26c63032-95a4-465a-ace8-f01742fa0aa6"
preview_database_id = "26c63032-95a4-465a-ace8-f01742fa0aa6"

[[kv_namespaces]]
binding = "NOTICIAS_KV"
id = "c0e878edccb34cfd85b31a4272928917"
preview_id = "ae9f9b48720e4022aa5cc86da03d1741"

[[r2_buckets]]
binding = "MATERIAIS_R2"
bucket_name = "intra-materiais"
preview_bucket_name = "intra-materiais"

[vars]
CF_ACCESS_AUD = ""
CF_ACCESS_TEAM_DOMAIN = "nobelcapital.cloudflareaccess.com"
